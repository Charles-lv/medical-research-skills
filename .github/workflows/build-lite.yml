name: build-lite

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inventory = 生成清单(只读,含 description/体积/诊断); prune = 构建 lite 分支(需写权限)"
        required: true
        default: inventory
        type: choice
        options: [inventory, prune]
      max_mb:
        description: "prune 模式下,大于该 MB 的残留文件一并删除"
        required: false
        default: "1"
      flatten:
        description: "prune 模式下,把保留的 skill 扁平化到 skills/<name>/ (消除路径空格,贴合 importer 期望布局)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- 只读:不写仓库,不需要任何权限 ----------
      # v4: 路径来源统一为 ls-tree(+quotePath=false),与 git show HEAD: 同源;
      #     去掉 set -e,单条失败只记账不杀进程;体积从 blob size 累加,不用 du。
      - name: Inventory
        if: ${{ inputs.mode == 'inventory' }}
        shell: bash
        run: |
          set -uo pipefail
          GIT="git -c core.quotePath=false"

          $GIT ls-tree -r -l HEAD \
            | awk -F'\t' '{split($1,m," "); if(m[2]=="blob") printf "%s\t%s\n", m[4], $2}' > /tmp/blobs.tsv
          echo "[info] blob 条目: $(wc -l < /tmp/blobs.tsv)"

          $GIT ls-tree -r --name-only HEAD | grep 'SKILL\.md$' \
            | sed 's|SKILL\.md$||; s|/$||' | sort -u > /tmp/dirs.txt
          total=$(wc -l < /tmp/dirs.txt)
          echo "[info] skill 目录总数: $total"

          printf 'path\tname\tsize_KB\tdescription\n' > INVENTORY.tsv
          : > /tmp/failed.txt
          ok=0; bad=0
          while IFS= read -r d; do
            if [ -z "$d" ]; then p="SKILL.md"; nm="(repo-root)"; pre=""
            else p="$d/SKILL.md"; nm=$(basename "$d"); pre="$d/"; fi
            if body=$($GIT show "HEAD:$p" 2>/dev/null); then
              ok=$((ok+1))
              desc=$(printf '%s' "$body" \
                | awk '/^description:/{sub(/^description:[[:space:]]*/,""); if($0=="|"||$0==">"){getline; sub(/^[[:space:]]+/,"")}; print; exit}' \
                | tr -d '\r' | cut -c1-200)
            else
              bad=$((bad+1)); echo "$p" >> /tmp/failed.txt; desc="[READ-FAILED]"
            fi
            kb=$(awk -F'\t' -v p="$pre" 'p=="" || index($2,p)==1 {s+=$1} END{printf "%.0f", s/1024}' /tmp/blobs.tsv)
            printf '%s\t%s\t%s\t%s\n' "${d:-.}" "$nm" "$kb" "$desc" >> INVENTORY.tsv
          done < /tmp/dirs.txt

          echo "[info] description 读取成功 $ok / 失败 $bad"
          if [ "$bad" -gt 0 ]; then
            echo "[warn] 以下路径无法从 HEAD 读取(最多列 30 条) —— 这是 v2 中 du 返空的同一批,请把本段贴回:"
            head -30 /tmp/failed.txt
          fi

          git archive --format=zip -o /tmp/full.zip HEAD 2>/dev/null || echo "[warn] git archive 失败"
          echo "=============================================="
          echo "  skill 目录总数: $total"
          echo "  完整 tree zipball 体积: $(du -h /tmp/full.zip 2>/dev/null | cut -f1)   (importer 上限 100MB)"
          echo "=============================================="
          echo "--- 顶层目录体积分布 ---"
          awk -F'\t' '{n=split($2,a,"/"); t=(n==1)?"(root files)":a[1]; s[t]+=$1} END{for(k in s) printf "%-40s %8.2f MB\n", k, s[k]/1048576}' /tmp/blobs.tsv | sort -k2 -rn
          echo
          echo "--- 各顶层目录的 skill 数 ---"
          awk -F'\t' 'NR>1{n=split($1,a,"/"); print (n==1)?a[1]:a[1]}' INVENTORY.tsv | sort | uniq -c | sort -rn
          echo
          echo "--- 单个 skill 体积 top 30 ---"
          tail -n +2 INVENTORY.tsv | sort -t$'\t' -k3 -rn > /tmp/by_size.txt
          head -30 /tmp/by_size.txt | awk -F'\t' '{printf "%10s KB  %s\n", $3, $1}'
          echo
          echo "注: 自身带 SKILL.md 的父目录(如 scientific-skills)其体积为整棵子树合计,非该 skill 本身。"

      - name: Upload inventory
        if: ${{ always() && inputs.mode == 'inventory' }}
        uses: actions/upload-artifact@v4
        with:
          name: inventory
          path: INVENTORY.tsv

      # ---------- 写分支:需要 contents: write ----------
      - name: Prune to lite
        if: ${{ inputs.mode == 'prune' }}
        shell: bash
        env:
          MAXMB: ${{ inputs.max_mb }}
          FLATTEN: ${{ inputs.flatten }}
        run: |
          set -uo pipefail
          test -f keep.txt || { echo "::error::仓库根目录缺少 keep.txt"; exit 1; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B lite

          sed -e 's/\r$//' -e 's/#.*//' -e 's|/*[[:space:]]*$||' -e 's/^[[:space:]]*//' keep.txt \
            | grep -v '^$' | sort -u > /tmp/keep.norm
          echo "[info] 保留清单条目: $(wc -l < /tmp/keep.norm)"

          git -c core.quotePath=false ls-tree -r --name-only HEAD | grep 'SKILL\.md$' \
            | sed 's|/SKILL\.md$||' | grep -v '^SKILL\.md$' | sort -u > /tmp/alldirs.txt
          sed 's|.*/||' /tmp/alldirs.txt | sort -u > /tmp/allnames.txt
          echo "[info] skill 目录总数: $(wc -l < /tmp/alldirs.txt)"

          kept=0; dropped=0
          while IFS= read -r d; do
            n=$(basename "$d")
            if grep -qxF "$n" /tmp/keep.norm; then kept=$((kept+1)); else git rm -rq "$d" && dropped=$((dropped+1)); fi
          done < /tmp/alldirs.txt
          echo "[info] 保留 $kept 个 / 删除 $dropped 个"

          miss=$(comm -23 /tmp/keep.norm /tmp/allnames.txt)
          if [ -n "$miss" ]; then
            echo "[warn] 以下清单条目在仓库内无匹配目录(拼写错误?):"; echo "$miss" | sed 's/^/  - /'
          else
            echo "[info] 清单条目全部命中"
          fi

          if [ "$FLATTEN" = "true" ]; then
            echo "[info] 扁平化到 skills/<name>/ :"
            moved=0; clash=0
            while IFS= read -r d; do
              n=$(basename "$d")
              grep -qxF "$n" /tmp/keep.norm || continue
              [ "$d" = "skills/$n" ] && continue
              if [ -e "skills/$n" ]; then echo "  [clash] skills/$n 已存在,跳过 $d"; clash=$((clash+1)); continue; fi
              mkdir -p skills
              if git mv "$d" "skills/$n" 2>/dev/null; then moved=$((moved+1)); else echo "  [fail] $d"; fi
            done < /tmp/alldirs.txt
            echo "[info] 已移动 $moved 个 / 同名冲突跳过 $clash 个"
            echo "[info] skills/ 下现有: $(ls -1 skills 2>/dev/null | wc -l) 个目录"
          else
            echo "[info] flatten=false,保持原有目录结构"
          fi

          echo "[info] 清理 > ${MAXMB}MB 的残留文件:"
          git ls-files > /tmp/files.txt
          while IFS= read -r f; do
            sz=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$sz" -gt $((MAXMB*1024*1024)) ]; then echo "  [drop] $f ($((sz/1024/1024))MB)"; git rm -qf "$f"; fi
          done < /tmp/files.txt

          git commit -m "lite: curated subset ($kept skills) [skip ci]" || echo "[info] 无变化"
          git archive --format=zip -o /tmp/lite.zip lite
          echo "=============================================="
          echo "  lite zipball 体积: $(du -h /tmp/lite.zip | cut -f1)   (importer 上限 100MB)"
          echo "  剩余文件数: $(git ls-files | wc -l)"
          echo "=============================================="
          git push -f origin lite
